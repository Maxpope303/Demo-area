name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  MAVEN_OPTS: -Xmx1024m
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/simple-pharmacy

jobs:
  # Create GitHub Release with auto-generated notes
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Get version from tag or input
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release - generating full changelog"
            COMMITS=$(git log --pretty=format:"- %s (%h) by @%an" --no-merges)
          else
            echo "Generating changelog from $PREVIOUS_TAG to ${{ steps.get_version.outputs.version }}"
            COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h) by @%an" --no-merges)
          fi
          
          # Create release notes file
          cat > release_notes.md << EOF
          ## 🚀 What's Changed
          
          $COMMITS
          
          ## 📦 Artifacts
          
          - **WAR File**: \`simple-pharmacy.war\` - Ready for deployment
          - **Container Image**: \`ghcr.io/${{ github.repository }}/simple-pharmacy:${{ steps.get_version.outputs.version }}\`
          - **Source Code**: Available as zip and tar.gz
          
          ## 🔧 Installation
          
          ### Using WAR file:
          \`\`\`bash
          # Download the WAR file from assets below
          # Deploy to your application server
          \`\`\`
          
          ### Using Container:
          \`\`\`bash
          podman pull ghcr.io/${{ github.repository }}/simple-pharmacy:${{ steps.get_version.outputs.version }}
          podman run -p 9080:9080 ghcr.io/${{ github.repository }}/simple-pharmacy:${{ steps.get_version.outputs.version }}
          \`\`\`
          
          ## 📊 Metrics
          
          - **Build Time**: Check workflow run for details
          - **Test Coverage**: See artifacts for coverage reports
          - **Security Scan**: All dependencies scanned with OWASP
          
          ## 🔗 Links
          
          - [Full Changelog](https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ steps.get_version.outputs.version }})
          - [Documentation](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.version }}/README.md)
          - [CI/CD Pipeline](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ steps.get_version.outputs.version }}
          EOF
          
          cat release_notes.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}

      - name: Notify Slack - Release Created
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🎉 New Release Created: ${{ steps.get_version.outputs.version }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🎉 New Release: ${{ steps.get_version.outputs.version }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ steps.get_version.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Released by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Type:*\n${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Production' }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "${{ steps.create_release.outputs.html_url }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Changelog"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.get_version.outputs.version }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # Build and attach release artifacts
  build-release-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'semeru'
          cache: 'maven'

      - name: Install WebSphere dependency
        run: |
          mvn install:install-file \
            -Dfile=was_dependency/was_public-9.0.0.jar \
            -DpomFile=was_dependency/was_public-9.0.0.pom

      - name: Build and Package
        run: |
          mvn clean package -DskipTests -B
          
          # Create checksums
          cd target
          sha256sum simple-pharmacy.war > simple-pharmacy.war.sha256
          md5sum simple-pharmacy.war > simple-pharmacy.war.md5

      - name: Upload WAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./target/simple-pharmacy.war
          asset_name: simple-pharmacy-${{ needs.create-release.outputs.version }}.war
          asset_content_type: application/java-archive

      - name: Upload SHA256 Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./target/simple-pharmacy.war.sha256
          asset_name: simple-pharmacy-${{ needs.create-release.outputs.version }}.war.sha256
          asset_content_type: text/plain

      - name: Upload MD5 Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./target/simple-pharmacy.war.md5
          asset_name: simple-pharmacy-${{ needs.create-release.outputs.version }}.war.md5
          asset_content_type: text/plain

  # Build and push container image
  build-and-push-container:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [create-release, build-release-artifacts]
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: simple-pharmacy-java17
          path: target/
        continue-on-error: true

      - name: Set up JDK 17 (if WAR not found)
        if: steps.download.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'semeru'
          cache: 'maven'

      - name: Build WAR (if not downloaded)
        if: steps.download.outcome == 'failure'
        run: |
          mvn install:install-file \
            -Dfile=was_dependency/was_public-9.0.0.jar \
            -DpomFile=was_dependency/was_public-9.0.0.pom
          mvn clean package -DskipTests -B

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and tag container image
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} .
          podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push container image
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Generate SBOM
        run: |
          # Install syft for SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          
          VERSION=${{ needs.create-release.outputs.version }}
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} -o spdx-json > sbom.spdx.json
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} -o cyclonedx-json > sbom.cyclonedx.json

      - name: Upload SBOM to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./sbom.spdx.json
          asset_name: sbom-${{ needs.create-release.outputs.version }}.spdx.json
          asset_content_type: application/json

      - name: Notify Slack - Release Complete
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Release ${{ needs.create-release.outputs.version }} Complete",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Release Complete: ${{ needs.create-release.outputs.version }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "All artifacts built and published successfully!"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*WAR File:*\n✅ Uploaded"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Container Image:*\n✅ Published"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*SBOM:*\n✅ Generated"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Checksums:*\n✅ Available"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Container Image:*\n`podman pull ghcr.io/${{ github.repository }}/simple-pharmacy:${{ needs.create-release.outputs.version }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

