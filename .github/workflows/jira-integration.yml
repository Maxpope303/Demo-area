name: Jira Integration

on:
  push:
    branches:
      - demo-java8-baseline
      - demo-modernized
      - main
  pull_request:
    types: [opened, closed, reopened]
  workflow_run:
    workflows: ["Java Modernization CI/CD Pipeline"]
    types: [completed]

env:
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

jobs:
  # Extract Jira issue key from commit messages or PR title
  extract-issue-key:
    name: Extract Jira Issue Key
    runs-on: ubuntu-latest
    outputs:
      issue-key: ${{ steps.extract.outputs.issue-key }}
      has-issue: ${{ steps.extract.outputs.has-issue }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10  # Get recent commits

      - name: Extract Issue Key
        id: extract
        run: |
          # Try to extract from PR title first
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            ISSUE_KEY=$(echo "$PR_TITLE" | grep -oE "$JIRA_PROJECT_KEY-[0-9]+" | head -1)
          fi
          
          # If not found, try commit messages
          if [ -z "$ISSUE_KEY" ]; then
            ISSUE_KEY=$(git log --format=%s -n 10 | grep -oE "$JIRA_PROJECT_KEY-[0-9]+" | head -1)
          fi
          
          if [ ! -z "$ISSUE_KEY" ]; then
            echo "issue-key=$ISSUE_KEY" >> $GITHUB_OUTPUT
            echo "has-issue=true" >> $GITHUB_OUTPUT
            echo "Found Jira issue: $ISSUE_KEY"
          else
            echo "has-issue=false" >> $GITHUB_OUTPUT
            echo "No Jira issue key found in commits or PR title"
          fi

  # Comment on Jira issue with build status
  update-jira-build-status:
    name: Update Jira with Build Status
    runs-on: ubuntu-latest
    needs: extract-issue-key
    if: needs.extract-issue-key.outputs.has-issue == 'true' && github.event_name == 'push'
    
    steps:
      - name: Wait for CI/CD Pipeline
        run: sleep 30  # Give CI/CD time to complete

      - name: Get Workflow Status
        id: workflow
        run: |
          # Get the latest workflow run status
          WORKFLOW_STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=push&branch=${{ github.ref_name }}&per_page=1" \
            | jq -r '.workflow_runs[0].conclusion // "in_progress"')
          
          echo "status=$WORKFLOW_STATUS" >> $GITHUB_OUTPUT
          echo "Workflow status: $WORKFLOW_STATUS"

      - name: Comment on Jira Issue
        env:
          ISSUE_KEY: ${{ needs.extract-issue-key.outputs.issue-key }}
          WORKFLOW_STATUS: ${{ steps.workflow.outputs.status }}
        run: |
          # Determine status emoji and message
          if [ "$WORKFLOW_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Build Successful"
            STATUS_COLOR="green"
          elif [ "$WORKFLOW_STATUS" = "failure" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="Build Failed"
            STATUS_COLOR="red"
          else
            STATUS_EMOJI="⏳"
            STATUS_TEXT="Build In Progress"
            STATUS_COLOR="yellow"
          fi
          
          # Create comment body
          COMMENT_BODY=$(cat <<EOF
          {
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "panel",
                  "attrs": {
                    "panelType": "info"
                  },
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "$STATUS_EMOJI $STATUS_TEXT",
                          "marks": [{"type": "strong"}]
                        }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Branch: "
                        },
                        {
                          "type": "text",
                          "text": "${{ github.ref_name }}",
                          "marks": [{"type": "code"}]
                        }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Commit: "
                        },
                        {
                          "type": "text",
                          "text": "${{ github.sha }}",
                          "marks": [{"type": "code"}]
                        }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Triggered by: ${{ github.actor }}"
                        }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "View Pipeline",
                          "marks": [
                            {
                              "type": "link",
                              "attrs": {
                                "href": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          }
          EOF
          )
          
          # Post comment to Jira
          curl -X POST \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_BODY" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment"
          
          echo "Comment added to $ISSUE_KEY"

  # Transition Jira issue based on PR events
  transition-jira-issue:
    name: Transition Jira Issue
    runs-on: ubuntu-latest
    needs: extract-issue-key
    if: needs.extract-issue-key.outputs.has-issue == 'true' && github.event_name == 'pull_request'
    
    steps:
      - name: Determine Transition
        id: transition
        run: |
          if [ "${{ github.event.action }}" = "opened" ]; then
            echo "transition-name=In Review" >> $GITHUB_OUTPUT
            echo "comment=Pull request opened for review" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.action }}" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "transition-name=Done" >> $GITHUB_OUTPUT
            echo "comment=Pull request merged successfully" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.action }}" = "closed" ]; then
            echo "transition-name=To Do" >> $GITHUB_OUTPUT
            echo "comment=Pull request closed without merging" >> $GITHUB_OUTPUT
          fi

      - name: Get Available Transitions
        id: get-transitions
        env:
          ISSUE_KEY: ${{ needs.extract-issue-key.outputs.issue-key }}
        run: |
          TRANSITIONS=$(curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions")
          
          echo "Available transitions:"
          echo "$TRANSITIONS" | jq -r '.transitions[] | "\(.id): \(.name)"'
          
          # Find transition ID by name
          TRANSITION_ID=$(echo "$TRANSITIONS" | jq -r ".transitions[] | select(.name==\"${{ steps.transition.outputs.transition-name }}\") | .id")
          
          if [ ! -z "$TRANSITION_ID" ]; then
            echo "transition-id=$TRANSITION_ID" >> $GITHUB_OUTPUT
            echo "Found transition ID: $TRANSITION_ID"
          else
            echo "Transition '${{ steps.transition.outputs.transition-name }}' not available"
          fi

      - name: Transition Issue
        if: steps.get-transitions.outputs.transition-id != ''
        env:
          ISSUE_KEY: ${{ needs.extract-issue-key.outputs.issue-key }}
          TRANSITION_ID: ${{ steps.get-transitions.outputs.transition-id }}
        run: |
          curl -X POST \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions"
          
          echo "Transitioned $ISSUE_KEY to ${{ steps.transition.outputs.transition-name }}"

      - name: Add PR Comment to Jira
        env:
          ISSUE_KEY: ${{ needs.extract-issue-key.outputs.issue-key }}
        run: |
          COMMENT_BODY=$(cat <<EOF
          {
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    {
                      "type": "text",
                      "text": "🔀 ${{ steps.transition.outputs.comment }}"
                    }
                  ]
                },
                {
                  "type": "paragraph",
                  "content": [
                    {
                      "type": "text",
                      "text": "View Pull Request",
                      "marks": [
                        {
                          "type": "link",
                          "attrs": {
                            "href": "${{ github.event.pull_request.html_url }}"
                          }
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          }
          EOF
          )
          
          curl -X POST \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_BODY" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment"

  # Summary
  jira-integration-summary:
    name: Jira Integration Summary
    runs-on: ubuntu-latest
    needs: [extract-issue-key, update-jira-build-status, transition-jira-issue]
    if: always() && needs.extract-issue-key.outputs.has-issue == 'true'
    
    steps:
      - name: Generate Summary
        env:
          ISSUE_KEY: ${{ needs.extract-issue-key.outputs.issue-key }}
        run: |
          echo "# 🎫 Jira Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issue**: [$ISSUE_KEY]($JIRA_BASE_URL/browse/$ISSUE_KEY)" >> $GITHUB_STEP_SUMMARY
          echo "**Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Jira ticket updated successfully" >> $GITHUB_STEP_SUMMARY

