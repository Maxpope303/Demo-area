name: Java Modernization CI/CD Pipeline

on:
  push:
    branches: 
      - demo-java8-baseline
      - demo-modernized
      - main
  pull_request:
    branches: 
      - demo-java8-baseline
      - demo-modernized
      - main
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx1024m
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/simple-pharmacy

jobs:
  # Determine Java version based on branch
  setup:
    name: Setup Build Configuration
    runs-on: ubuntu-latest
    outputs:
      java-version: ${{ steps.config.outputs.java-version }}
      runtime: ${{ steps.config.outputs.runtime }}
    steps:
      - name: Determine Configuration
        id: config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/demo-java8-baseline" ]]; then
            echo "java-version=8" >> $GITHUB_OUTPUT
            echo "runtime=websphere-traditional" >> $GITHUB_OUTPUT
          else
            echo "java-version=17" >> $GITHUB_OUTPUT
            echo "runtime=liberty" >> $GITHUB_OUTPUT
          fi

  # Build and test the application
  build-and-test:
    name: Build & Test (Java ${{ needs.setup.outputs.java-version }})
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up JDK ${{ needs.setup.outputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.setup.outputs.java-version }}
          distribution: 'semeru'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install WebSphere dependency
        run: |
          mvn install:install-file \
            -Dfile=was_dependency/was_public-9.0.0.jar \
            -DpomFile=was_dependency/was_public-9.0.0.pom

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run Unit Tests
        run: mvn test -B

      - name: Generate Code Coverage Report
        run: mvn jacoco:report

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: |
            target/surefire-reports/*.xml

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java${{ needs.setup.outputs.java-version }}
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Package Application
        run: mvn package -DskipTests -B

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-pharmacy-java${{ needs.setup.outputs.java-version }}
          path: target/*.war
          retention-days: 30

  # Code quality and security analysis
  code-quality:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'semeru'
          cache: 'maven'

      - name: Run SpotBugs Analysis
        run: mvn spotbugs:check -B
        continue-on-error: true

      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/dependency-check-report.html

  # Build container image with Podman
  container-build:
    name: Build Container Image (Podman)
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: simple-pharmacy-java${{ needs.setup.outputs.java-version }}
          path: target/

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Build image with Podman
        run: |
          podman build -t simple-pharmacy:${{ github.sha }} .
          podman tag simple-pharmacy:${{ github.sha }} simple-pharmacy:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: simple-pharmacy:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Save container image
        run: |
          podman save simple-pharmacy:${{ github.sha }} -o simple-pharmacy-image.tar

      - name: Upload container image artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image-java${{ needs.setup.outputs.java-version }}
          path: simple-pharmacy-image.tar
          retention-days: 7

  # Coverage gate - ensure minimum coverage
  coverage-gate:
    name: Coverage Gate (50% minimum)
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ needs.setup.outputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.setup.outputs.java-version }}
          distribution: 'semeru'
          cache: 'maven'

      - name: Check Coverage
        run: mvn verify -B
          
      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 50

  # Approval gate for modernized branch
  approval-gate:
    name: Deployment Approval Required
    runs-on: ubuntu-latest
    needs: [setup, build-and-test, code-quality, container-build, coverage-gate]
    if: github.ref == 'refs/heads/demo-modernized' && github.event_name == 'push'
    environment:
      name: production-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    steps:
      - name: Approval Checkpoint
        run: |
          echo "✅ All automated checks passed!"
          echo "📊 Build: Success"
          echo "🧪 Tests: Passed"
          echo "🔒 Security: Scanned"
          echo "📦 Container: Built"
          echo "📈 Coverage: Met threshold"
          echo ""
          echo "Deployment approved by: ${{ github.actor }}"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

  # Summary report
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [setup, build-and-test, code-quality, container-build, coverage-gate]
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 Java Modernization Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version**: ${{ needs.setup.outputs.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime**: ${{ needs.setup.outputs.runtime }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Test: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Container Build: ${{ needs.container-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Gate: ${{ needs.coverage-gate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- WAR file: simple-pharmacy-java${{ needs.setup.outputs.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Container image: container-image-java${{ needs.setup.outputs.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test reports: test-reports-java${{ needs.setup.outputs.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security reports: security-reports" >> $GITHUB_STEP_SUMMARY

