# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    reviewers:
      - "your-team"  # Replace with your GitHub team or usernames
    assignees:
      - "your-team"
    labels:
      - "dependencies"
      - "maven"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group updates for better management
    groups:
      struts:
        patterns:
          - "org.apache.struts*"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
      security:
        patterns:
          - "org.owasp*"
          - "com.github.spotbugs*"
      build-tools:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.jacoco*"
    # Security updates only for critical dependencies
    ignore:
      - dependency-name: "javax.servlet:javax.servlet-api"
        update-types: ["version-update:semver-major"]
      - dependency-name: "javax.servlet.jsp:javax.servlet.jsp-api"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Docker/Container dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

